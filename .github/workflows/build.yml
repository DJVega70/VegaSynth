name: Build Vega Productions Workstation
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    name: Windows VST3
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vega Productions Workstation
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Vega Productions Workstation
        run: cmake --build build --config Release --target PcmWorkstation_VST3
      - name: Package Vega Productions Workstation
        shell: pwsh
        run: Compress-Archive -Path "build/PcmWorkstation_artefacts/Release/VST3/Vega Productions Workstation.vst3" -DestinationPath VegaProductions-Workstation-VST3-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VegaProductions-Workstation-Windows-VST3
          path: VegaProductions-Workstation-VST3-win64.zip

  macos:
    name: macOS VST3 + AU (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vega Productions Workstation
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build Vega Productions Workstation
        run: cmake --build build --config Release --target PcmWorkstation_VST3 PcmWorkstation_AU --parallel
      - name: Sign and package Vega Productions Workstation
        run: |
          codesign --force --deep -s - "build/PcmWorkstation_artefacts/Release/VST3/Vega Productions Workstation.vst3"
          codesign --force --deep -s - "build/PcmWorkstation_artefacts/Release/AU/Vega Productions Workstation.component"
          mkdir -p dist-PcmWorkstation
          cp -R "build/PcmWorkstation_artefacts/Release/VST3/Vega Productions Workstation.vst3" "build/PcmWorkstation_artefacts/Release/AU/Vega Productions Workstation.component" dist-PcmWorkstation/
          cd dist-PcmWorkstation && zip -r -y ../VegaProductions-Workstation-macOS.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: VegaProductions-Workstation-macOS-VST3-AU
          path: VegaProductions-Workstation-macOS.zip
