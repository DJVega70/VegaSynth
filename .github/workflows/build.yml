name: Build PCM Workstation (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target PcmWorkstation_VST3
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/PcmWorkstation_artefacts/Release/VST3/PCM Workstation.vst3" -DestinationPath PCMWorkstation-VST3-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PCMWorkstation-VST3-win64
          path: PCMWorkstation-VST3-win64.zip
